name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend behavior
        run: node --test tests/frontend.test.cjs

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q closeready scripts

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Build deployment image
        run: docker build --tag closeready:ci .
